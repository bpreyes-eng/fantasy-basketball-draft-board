<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Basketball Draft Board</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}.w{max-width:900px;margin:auto;padding:14px}.top{position:sticky;top:0;background:#0b0d12f5;z-index:5;padding:10px 0}h1{margin:0;font-size:25px}.sub,.stats{color:#9aa5b6;font-size:13px;margin:5px 0 10px}.controls{display:flex;gap:7px;flex-wrap:wrap}input,select,button,textarea{background:#151a24;color:#fff;border:1px solid #2b3342;border-radius:9px;padding:10px}input{flex:1;min-width:150px}.card{border:1px solid #262d3a;background:#111620;border-radius:12px;padding:12px;margin:10px 0}.board{border:1px solid #262d3a;border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:42px 1fr 72px;gap:7px;align-items:center;padding:10px;border-bottom:1px solid #202735}.head{font-size:10px;color:#8c98aa}.name{font-weight:650}.drafted{opacity:.25;text-decoration:line-through}.tag{font-size:9px;border-radius:20px;padding:3px 5px;margin-left:4px;background:#3c3013;color:#ffd76c}.rook{background:#153a2a;color:#83efb1}.inj{background:#38243f;color:#e6a8ff}.bust{background:#431d24;color:#ff9da9}textarea{width:100%;min-height:70px}</style></head><body><div class="w"><div class="top"><h1>🏀 Fantasy Basketball Draft Board</h1><div class="sub">2026-27 • FantasyBall365 primary • 150 players</div><div id="stats" class="stats"></div><div class="controls"><input id="q" placeholder="Search player"><select id="filter"><option>All</option><option>Available</option><option>Targets</option><option>Rookies</option><option>Sleepers</option><option>Injury Risk</option><option>Busts</option></select><button id="undo">Undo</button><button id="reset">Reset</button></div></div><div class="card"><b>Paste draft picks</b><textarea id="paste" placeholder="Paste player names or draft-room text"></textarea><button id="apply">Cross off matches</button> <span id="matched"></span></div><div class="board"><div class="row head"><div>FB</div><div>PLAYER</div><div>ACTION</div></div><div id="list"></div></div></div><script>const names=["Nikola Jokic","Victor Wembanaya","Shai Gilgeous-Alexander","Luka Doncic","Giannis Antetokounmpo","Cade Cunningham","Jayson Tatum","Anthony Edwards","Cooper Flagg","Tyrese Maxey","Kevin Durant","Jalen Johnson","Tyrese Haliburton","Austin Reaves","Scottie Barnes","Donovan Mitchell","Jamal Murray","Karl-Anthony Towns","Amen Thompson","LaMelo Ball","Anthony Davis","Alperen Sengun","James Harden","Trae Young","Kyrie Irving","Steph Curry","Josh Giddey","Lauri Markkanen","Trey Murphy","Devin Booker","Brandon Miller","Bam Adebayo","Evan Mobley","Kawhi Leonard","Jalen Brunson","Jalen Williams","Nickeil Alexander-Walker","Domantas Sabonis","Darius Garland","Chet Holmgren","Derrick White","Dyson Daniels","Jaren Jackson","Walker Kessler","Dejounte Murray","Desmond Bane","Paul George","Jaylen Brown","Jalen Duren","Matas Buzelis","OG Anunoby","Damian Lillard","Cameron Boozer","Michael Porter","Keyonte George","Paolo Banchero","Donovan Clingan","Deni Avdija","Onyeka Okongwu","Tyler Herro","Kel'El Ware","LeBron James","Joel Embiid","Franz Wagner","Zach Edey","Ty Jerome","Pascal Siakam","Ausar Thompson","Julius Randle","Ivica Zubac","Naz Reid","Ryan Rollins","Rudy Gobert","Jarrett Allen","Jaden McDaniels","Dylan Harper","Immanuel Quickley","Day'Ron Sharpe","Kon Knueppel","VJ Edgecombe","De'Aaron Fox","Isaiah Hartenstein","Collin Murray-Boyles","Caleb Wilson","Stephon Castle","Alex Sarr","Norman Powell","Fred VanVleet","Zion Williamson","Keegan Murray","Josh Hart","Jalen Suggs","Mikal Bridges","Payton Pritchard","Coby White","Myles Turner","Brandin Podziemski","Jakob Poeltl","Zach LaVine","CJ McCollum","Yaxel Lendeborg","Ja Morant","Andrew Wiggins","Neemias Queta","Khaman Maluach","Kevin Porter","John Collins","Cason Wallace","Cedric Coward","Darryn Peterson","Jabari Smith","Moussa Diabate","Darius Acuff","Derik Queen","Reed Sheppard","Jalen Green","Grayson Allen","Quentin Grimes","AJ Dybantsa","Brandon Ingram","Ajay Mitchell","Jeremiah Fears","Sandro Mamukelashvili","Egor Demin","Gui Santos","Peyton Watson","Cam Johnson","Jaime Jaquez","Miles Bridges","Isaiah Jackson","DeMar DeRozan","Paul Reed","Morez Johnson","Ayo Dosunmu","Rui Hachimura","Nicolas Claxton","Keaton Wagler","Ben Simmons","Scotty Pippen","Kyshawn George","Jimmy Butler","Toumani Camara","Tari Eason","RJ Barrett","Aaron Nesmith","Jalen Smith","Pelle Larsson","Oso Ighodaro","Draymond Green","Ace Bailey"];const rook=new Set(["Cameron Boozer","Caleb Wilson","Darryn Peterson","AJ Dybantsa","Yaxel Lendeborg","Darius Acuff","Keaton Wagler","Morez Johnson","Collin Murray-Boyles","Khaman Maluach"]);const sleep=new Set(["Kel'El Ware","Yaxel Lendeborg","Darius Acuff","Keaton Wagler","Morez Johnson","Ryan Rollins","Reed Sheppard","Ajay Mitchell"]);const inj=new Set(["Steph Curry","LaMelo Ball","Anthony Davis","Kawhi Leonard","Kyrie Irving","LeBron James","Joel Embiid","Zach Edey","Paul George","Brandon Ingram","Ja Morant","Zion Williamson","Jalen Suggs","Jakob Poeltl"]);const bust=new Set(["Alperen Sengun","Jalen Brunson","Jaylen Brown","Paolo Banchero","LeBron James","Deni Avdija","Donovan Clingan","Pascal Siakam","Kon Knueppel","Stephon Castle","Ivica Zubac","Zion Williamson","Alex Sarr","Brandon Ingram","AJ Dybantsa","Derik Queen","Cedric Coward","Coby White","Jabari Smith","Nicolas Claxton","Miles Bridges","Ayo Dosunmu"]);const seed=["Jayson Tatum","Kevin Durant","Steph Curry","Austin Reaves","Chet Holmgren","Trey Murphy","Jaren Jackson","Paul George","Immanuel Quickley","Zach Edey"];let drafted=new Set(JSON.parse(localStorage.getItem('drafted')||'[]')),targets=new Set(JSON.parse(localStorage.getItem('targets')||'[]')),hist=[];if(!localStorage.getItem('seeded')){seed.forEach(x=>targets.add(x));localStorage.setItem('seeded','1')}function save(){localStorage.setItem('drafted',JSON.stringify([...drafted]));localStorage.setItem('targets',JSON.stringify([...targets]))}function pick(n){hist.push(new Set(drafted));drafted.has(n)?drafted.delete(n):drafted.add(n);save();render()}function star(n,e){e.stopPropagation();targets.has(n)?targets.delete(n):targets.add(n);save();render()}function render(){let s=q.value.toLowerCase(),f=filter.value;let a=names.map((name,i)=>({name,rank:i+1})).filter(p=>p.name.toLowerCase().includes(s)&&(f==='All'||f==='Available'&&!drafted.has(p.name)||f==='Targets'&&targets.has(p.name)||f==='Rookies'&&rook.has(p.name)||f==='Sleepers'&&sleep.has(p.name)||f==='Injury Risk'&&inj.has(p.name)||f==='Busts'&&bust.has(p.name)));list.innerHTML=a.map(p=>`<div class="row ${drafted.has(p.name)?'drafted':''}" onclick='pick(${JSON.stringify(p.name)})'><b>${p.rank}</b><div class="name">${p.name}${rook.has(p.name)?'<span class="tag rook">ROOKIE</span>':''}${sleep.has(p.name)?'<span class="tag">SLEEPER</span>':''}${inj.has(p.name)?'<span class="tag inj">INJURY</span>':''}${bust.has(p.name)?'<span class="tag bust">BUST</span>':''}</div><div><button onclick='star(${JSON.stringify(p.name)},event)'>${targets.has(p.name)?'⭐':'☆'}</button> ${drafted.has(p.name)?'↩':'✓'}</div></div>`).join('');stats.textContent=`Available ${names.length-drafted.size}/${names.length} • Drafted ${drafted.size} • ⭐ Targets ${targets.size}`}q.oninput=render;filter.onchange=render;undo.onclick=()=>{if(hist.length){drafted=hist.pop();save();render()}};reset.onclick=()=>{if(confirm('Reset board?')){drafted.clear();targets.clear();hist=[];save();render()}};apply.onclick=()=>{let t=paste.value.toLowerCase(),m=[];hist.push(new Set(drafted));names.forEach(n=>{if(t.includes(n.toLowerCase())){drafted.add(n);m.push(n)}});save();matched.textContent=`Matched ${m.length}`;paste.value='';render()};save();render();</script></body></html>
